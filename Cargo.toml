[package]
name = "studio-run"
description = "Run Luau scripts inside Roblox Studio and stream their output to your terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
keywords = ["roblox", "luau", "studio", "testing", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tiny_http = "0.12.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
