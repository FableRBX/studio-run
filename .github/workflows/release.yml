name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Tag matches Cargo.toml
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$crate_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $crate_version in Cargo.toml"
            exit 1
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: check-version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
          # Studio doesn't run on Linux, but Rokit installs every tool in a
          # project's rokit.toml, so Linux machines need a build to install.
          # musl keeps the binary static, so it runs on any distro.
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (macOS and Linux)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          zip "$GITHUB_WORKSPACE/studio-run-${GITHUB_REF_NAME#v}-${{ matrix.label }}.zip" studio-run

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/studio-run.exe `
            -DestinationPath "studio-run-$version-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: studio-run-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --verify-tag \
            --title "studio-run ${GITHUB_REF_NAME#v}" \
            --generate-notes
